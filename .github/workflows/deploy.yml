name: Build and Deploy

on:
  push:
    branches:
      - cv
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass
      
      - name: Deploy to server
        env:
          USER_NAME: ${{ secrets.USER_NAME }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: |
          # Создаем архив билда
          tar -czf dist.tar.gz -C dist .
          
          # Копируем на сервер
          sshpass -p "$USER_PASSWORD" scp -o StrictHostKeyChecking=no dist.tar.gz $USER_NAME@$DOMAIN_NAME:/tmp/
          
          # Распаковываем на сервере
          sshpass -p "$USER_PASSWORD" ssh -o StrictHostKeyChecking=no $USER_NAME@$DOMAIN_NAME \
            "sudo rm -rf /var/www/html/* && \
             sudo tar -xzf /tmp/dist.tar.gz -C /var/www/html/ && \
             sudo chown -R www-data:www-data /var/www/html/ && \
             rm /tmp/dist.tar.gz"
      
      - name: Cleanup
        if: always()
        run: rm -f dist.tar.gz

